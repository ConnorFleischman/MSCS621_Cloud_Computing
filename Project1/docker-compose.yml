services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-app:
    build: .
    container_name: go-app
    env_file:
      - ./tests/.env
    environment:
      # Connect using the mongodb container name rather than localhost
      - MONGO_URI=mongodb://admin:secret@mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
