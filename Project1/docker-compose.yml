version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo-data:/data/db

  go-app:
    build: .
    container_name: go-app
    environment:
      # Connect using the mongodb container name rather than localhost
      - MONGO_URI=mongodb://admin:secret@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo-data: